<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | Employee Manager">Employee Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Home</a>
        <div class="d-flex align-items-center gap-3">
            <a class="nav-link text-white" th:href="@{/employees}">Employees</a>
            <a class="nav-link text-white" th:href="@{/companies}">Companies</a>
            <a class="btn btn-light btn-sm" sec:authorize="hasRole('ADMIN')" th:href="@{/employees/new}">Add employee</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
            </form>
        </div>
    </div>
</nav>
<main class="container py-4" layout:fragment="content"></main>
</body>
</html>
