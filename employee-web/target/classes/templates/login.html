<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Employee Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head><body class="login-page"><main class="login-card card shadow">
    <h1 class="h3 mb-1">Employee Manager</h1><p class="text-secondary mb-4">Sign in to continue</p>
    <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have logged out.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>

    <div class="mt-3">
        <span>Don't have account?</span>
        <a th:href="@{/register}">Register here</a>
    </div>
</main></body></html>
