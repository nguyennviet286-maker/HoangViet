<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Đăng ký tài khoản</title>
</head>
<body>
<section layout:fragment="content" class="container mt-4">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h2 class="card-title mb-4">Đăng ký tài khoản</h2>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input id="username" type="text" class="form-control"
                           th:field="*{username}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input id="password" type="password" class="form-control"
                           th:field="*{password}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                    <input id="confirmPassword" type="password" class="form-control"
                           th:field="*{confirmPassword}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <div class="text-danger mb-3" th:if="${error}" th:text="${error}"></div>

                <button type="submit" class="btn btn-primary">Đăng ký</button>
                <a th:href="@{/login}" class="btn btn-outline-secondary">Quay lại đăng nhập</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
