<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Form | Employee Manager</title>
</head>

<body>
<section layout:fragment="content" class="container py-4">
    <h1 class="mb-4"
        th:text="${employee.id == null} ? 'Add Employee' : 'Edit Employee'">
        Employee Form
    </h1>

    <form class="card card-body shadow-sm form-card"
          th:action="@{/employees/save}"
          th:object="${employee}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name"
                   type="text"
                   class="form-control"
                   th:field="*{name}">
            <div class="invalid-feedback d-block"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input id="age"
                   type="number"
                   class="form-control"
                   th:field="*{age}">
            <div class="invalid-feedback d-block"
                 th:if="${#fields.hasErrors('age')}"
                 th:errors="*{age}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Employee Image</label>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="imageFile" class="form-label">1. Choose from device</label>
                    <input id="imageFile" name="imageFile" type="file" class="form-control"
                           accept="image/png,image/jpeg,image/webp">
                    <div class="form-text">PNG, JPEG, or WebP; up to 5 MB.</div>
                </div>
                <div class="col-md-6">
                    <label for="imageUrl" class="form-label">2. Paste image link</label>
                    <input id="imageUrl" name="imageUrl" type="url" class="form-control"
                           placeholder="https://example.com/photo.jpg" th:value="${imageUrl}">
                    <div class="form-text">Use a direct HTTP or HTTPS image URL.</div>
                </div>
            </div>
            <div class="form-text">Choose either a device file or a link. If both are provided, the device file is used.</div>

            <div class="form-text"
                 th:if="${employee.image != null and !#strings.isEmpty(employee.image)}">
                Current image is shown below. Leave both choices empty to keep it.
            </div>
            <div class="text-danger mt-2" th:if="${uploadError}" th:text="${uploadError}"></div>

            <div class="mt-3">
                <p class="form-label mb-2" id="currentImageLabel"
                   th:if="${employee.image != null and !#strings.isEmpty(employee.image)}">Current image</p>
                <img id="currentImagePreview"
                     th:if="${employee.image != null and !#strings.isEmpty(employee.image)}"
                     th:src="${employee.image}" alt="Current employee image"
                     style="max-width: 200px; max-height: 200px; object-fit: cover;">
                <p class="form-label mt-2 mb-0" id="newImageLabel" style="display: none;">New image preview</p>
                <img id="newImagePreview" alt="Selected employee image preview"
                     style="display: none; max-width: 200px; max-height: 200px; object-fit: cover;">
            </div>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input id="address"
                   type="text"
                   class="form-control"
                   th:field="*{address}">
            <div class="invalid-feedback d-block"
                 th:if="${#fields.hasErrors('address')}"
                 th:errors="*{address}"></div>
        </div>

        <div class="mb-3">
            <label for="companyId" class="form-label">Company name</label>
            <select id="companyId" name="companyId" class="form-select">
                <option value="" th:selected="${companyId == null}">No company</option>
                <option th:each="company : ${companies}"
                        th:value="${company.id}"
                        th:text="${company.name}"
                        th:selected="${companyId != null and companyId == company.id}">Company name</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/employees}">Cancel</a>
        </div>
    </form>

    <script>
        const imageInput = document.getElementById("imageFile");
        const imageUrlInput = document.getElementById("imageUrl");
        const newImagePreview = document.getElementById("newImagePreview");
        const newImageLabel = document.getElementById("newImageLabel");
        const currentImageLabel = document.getElementById("currentImageLabel");
        let currentPreviewUrl = null;

        function showNewImagePreview(source) {
            newImagePreview.src = source;
            newImagePreview.style.display = "block";
            newImageLabel.style.display = "block";
            if (currentImageLabel) currentImageLabel.style.display = "none";
            const currentPreview = document.getElementById("currentImagePreview");
            if (currentPreview) currentPreview.style.display = "none";
        }

        function clearNewImagePreview() {
            newImagePreview.removeAttribute("src");
            newImagePreview.style.display = "none";
            newImageLabel.style.display = "none";
            if (currentImageLabel) currentImageLabel.style.display = "block";
            const currentPreview = document.getElementById("currentImagePreview");
            if (currentPreview) currentPreview.style.display = "block";
        }

        imageInput.addEventListener("change", function () {
            const file = this.files[0];

            if (currentPreviewUrl) {
                URL.revokeObjectURL(currentPreviewUrl);
                currentPreviewUrl = null;
            }

            if (!file) {
                if (imageUrlInput.value.trim()) {
                    showNewImagePreview(imageUrlInput.value.trim());
                } else {
                    clearNewImagePreview();
                }
                return;
            }

            const allowedTypes = ["image/png", "image/jpeg", "image/webp"];

            if (!allowedTypes.includes(file.type)) {
                alert("Please select a PNG, JPEG, or WebP image.");
                this.value = "";
                clearNewImagePreview();
                return;
            }

            currentPreviewUrl = URL.createObjectURL(file);
            showNewImagePreview(currentPreviewUrl);
        });

        imageUrlInput.addEventListener("input", function () {
            if (imageInput.files.length) return;
            if (this.value.trim()) showNewImagePreview(this.value.trim());
            else clearNewImagePreview();
        });
    </script>
</section>
</body>
</html>
